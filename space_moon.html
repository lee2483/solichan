<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuron Solar System</title>
    <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        canvas { display: block; }
        #neuronCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
        #moonCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            cursor: grab;
        }
        #moonCanvas.dragging {
            cursor: grabbing;
        }
        #digitalClock {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'DS-Digital', monospace;
            font-size: 14px;
            color: #cccccc;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 260px;
            z-index: 2;
        }
        #digitalClock span {
            display: inline-block;
            text-align: center;
        }
        #digitalClock #year { width: 36px; }
        #digitalClock #month,
        #digitalClock #day,
        #digitalClock #hours,
        #digitalClock #minutes,
        #digitalClock #seconds {
            width: 18px;
        }
        #digitalClock #milliseconds {
            width: 16px;
        }
        #digitalClock .colon,
        #digitalClock .dot {
            width: 4px;
        }
        #copyright {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            width: 100%;
            z-index: 2;
        }
        #copyright span {
            color: white;
        }
        /* ===== 좌측 정보 패널 ===== */
        #infoPanel {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 2;
            width: 210px;
            font-family: 'Orbitron', sans-serif;
            color: #cfd8ff;
            opacity: 0;
        }
        #infoPanel.show {
            animation: panelIn 0.8s ease forwards;
        }
        @keyframes panelIn {
            from { opacity: 0; transform: translateY(-50%) translateX(-30px); }
            to   { opacity: 1; transform: translateY(-50%) translateX(0); }
        }
        #bodyName {
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow:
                0 0 4px rgba(180, 220, 255, 1),
                0 0 10px rgba(120, 180, 255, 1),
                0 0 22px rgba(80, 140, 255, 0.9),
                0 0 45px rgba(60, 120, 255, 0.6);
            margin-bottom: 8px;
        }
        #bodyDesc {
            font-family: 'Orbitron', 'Malgun Gothic', sans-serif;
            font-size: 0.65rem;
            line-height: 1.6;
            color: rgba(210, 220, 255, 0.85);
            margin-bottom: 14px;
        }
        .ctrlLabel {
            font-size: 0.55rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(150, 190, 255, 0.9);
            margin-bottom: 8px;
        }
        .ctrlLabel span {
            float: right;
            color: #ffffff;
        }
        .sliderRow {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.5rem;
            color: rgba(150, 190, 255, 0.7);
            margin-bottom: 12px;
        }
        .sliderRow input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 3px;
            background: linear-gradient(90deg, rgba(80, 140, 255, 0.2), rgba(120, 180, 255, 0.8));
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .sliderRow input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(120, 180, 255, 1);
            cursor: pointer;
        }
        @media (max-width: 768px) {
            #infoPanel { width: 170px; left: 16px; }
            #bodyName { font-size: 1.1rem; }
        }
        /* ===== 위/아래 스크롤 안내 화살표 ===== */
        .scrollHint {
            position: absolute;
            left: 50%;
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(120, 180, 255, 0.8));
        }
        #hintUp {
            top: calc(50% - 31vh);
            animation: hintUp 3s ease-in-out infinite;
        }
        #hintDown {
            top: calc(50% + 27vh);
            animation: hintDown 3s ease-in-out infinite;
        }
        @keyframes hintUp {
            0%   { opacity: 0; transform: translate(-50%, 6px); }
            35%  { opacity: 0.85; transform: translate(-50%, -6px); }
            70%  { opacity: 0; transform: translate(-50%, -12px); }
            100% { opacity: 0; transform: translate(-50%, 6px); }
        }
        @keyframes hintDown {
            0%   { opacity: 0; transform: translate(-50%, -6px); }
            35%  { opacity: 0.85; transform: translate(-50%, 6px); }
            70%  { opacity: 0; transform: translate(-50%, 12px); }
            100% { opacity: 0; transform: translate(-50%, -6px); }
        }
    </style>
</head>
<body>
    <canvas id="neuronCanvas"></canvas>

        <span id="year"></span>
        <span class="colon">:</span>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ===== 뉴런(우주) 배경 =====
        const canvas = document.getElementById('neuronCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function calculateMaxNeurons() {
            if (window.innerWidth < 768) {
                return 500; // 모바일
            } else if (window.innerWidth < 1024) {
                return 1000; // 태블릿
            } else {
                return 2000; // 데스크탑
            }
        }

        let maxNeurons = calculateMaxNeurons();
        const connectionDistance = 300;

        const neurons = [];

        class Neuron {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = 1 + Math.random() * 1.5;
                this.color = this.getRandomGray();
                this.opacity = 0;
                this.fadeSpeed = 0.002 + Math.random() * 0.005;
                this.fadeIn = true;
                this.vx = (Math.random() - 0.5) * 0.1;
                this.vy = (Math.random() - 0.5) * 0.1;
                this.lifespan = 2000 + Math.random() * 4000; // 2-6초 수명
                this.birth = Date.now();
            }

            getRandomGray() {
                const value = Math.floor(Math.random() * 155) + 100;
                return `rgb(${value}, ${value}, ${value})`;
            }

            update() {
                const age = Date.now() - this.birth;
                if (age > this.lifespan) {
                    this.fadeIn = false;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                if (this.fadeIn) {
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 1) {
                        this.opacity = 1;
                    }
                } else {
                    this.opacity -= this.fadeSpeed;
                    if (this.opacity <= 0) {
                        return false;
                    }
                }
                return true;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color.replace('rgb', 'rgba').replace(')', `, ${this.opacity})`);
                ctx.fill();
            }
        }

        function drawConnections() {
            ctx.lineWidth = 1;
            for (let i = 0; i < neurons.length; i++) {
                for (let j = i + 1; j < neurons.length; j++) {
                    const dx = neurons[i].x - neurons[j].x;
                    const dy = neurons[i].y - neurons[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < connectionDistance) {
                        const opacity = (1 - distance / connectionDistance) * 0.15 *
                                        Math.min(neurons[i].opacity, neurons[j].opacity);
                        ctx.beginPath();
                        ctx.moveTo(neurons[i].x, neurons[i].y);
                        ctx.lineTo(neurons[j].x, neurons[j].y);
                        ctx.strokeStyle = `rgba(150, 150, 150, ${opacity})`;
                        ctx.stroke();
                    }
                }
            }
        }

        function animateNeurons() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (neurons.length < maxNeurons) {
                neurons.push(new Neuron());
            }

            drawConnections();

            for (let i = neurons.length - 1; i >= 0; i--) {
                if (!neurons[i].update()) {
                    neurons.splice(i, 1);
                } else {
                    neurons[i].draw();
                }
            }

            requestAnimationFrame(animateNeurons);
        }

        animateNeurons();

        // ===== 천체 (three.js) - 쇼츠 스타일 휠 전환 =====
        // 나중에 행성을 추가하려면 이 배열에 항목만 추가하면 됨
        const TX = 'https://cdn.jsdelivr.net/gh/jeromeetienne/threex.planets/images/';
        const BODIES = [
            {
                name: 'sun',
                korean: '태양',
                desc: '태양계의 중심에 존재하는 항성으로, 태양계의 유일한 항성이자 에너지의 근원이다.',
                texture: TX + 'sunmap.jpg',
                radius: 1.35,
                segments: 64,

                basic: true,      // 스스로 빛나므로 조명 영향 없음
                tint: 0xff8844,   // 붉은 색조
                fire: true,       // 가장자리 화염 코로나
                glow: true        // 붉은 광채
            },
            {

                desc: '태양에서 가장 가까운 행성으로, 대기가 거의 없어 낮과 밤의 온도 차가 600도에 이른다.',
                texture: TX + 'mercurymap.jpg',
                radius: 0.5,
                segments: 64,
                rotationSpeed: 0.0004
            },
            {
                name: 'venus',
                korean: '금성',
                desc: '두꺼운 이산화탄소 대기의 온실효과로 표면 온도가 460도가 넘는, 태양계에서 가장 뜨거운 행성이다.',
                texture: TX + 'venusmap.jpg',
                radius: 0.72,
                segments: 64,
                rotationSpeed: -0.0003 // 역자전 (태양계 행성 중 유일)
            },
            {
                name: 'earth',
                korean: '지구',
                desc: '태양계에서 유일하게 생명체가 확인된 행성으로, 표면의 70%가 물로 덮여 있다.',
                texture: 'https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg',
                radius: 0.75,
                segments: 64,
                rotationSpeed: 0.0012,
                tilt: 0.41 // 자전축 기울기 (23.5도)
            },
            {
                name: 'moon',
                korean: '달',
                desc: '지구의 유일한 자연 위성으로, 조석 현상을 일으키며 항상 같은 면만 지구를 향한다.',
                texture: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/17271/lroc_color_poles_1k.jpg',

            },
            {
                name: 'mars',
                korean: '화성',

                texture: TX + 'marsmap1k.jpg',
                radius: 0.6,
                segments: 64,
                rotationSpeed: 0.0012,
                tilt: 0.44 // 자전축 기울기 (25.2도)
            },
            {
                name: 'jupiter',
                korean: '목성',
                desc: '태양계에서 가장 큰 행성으로, 대적점이라 불리는 지구보다 큰 거대한 폭풍이 있다.',
                texture: TX + 'jupitermap.jpg',
                radius: 1.2,
                segments: 64,
                rotationSpeed: 0.0025
            },
            {
                name: 'saturn',
                korean: '토성',
                desc: '아름다운 고리를 가진 태양계에서 두 번째로 큰 행성으로, 밀도가 물보다 낮다.',
                texture: TX + 'saturnmap.jpg',
                radius: 0.95,
                segments: 64,
                rotationSpeed: 0.0018,
                tilt: 0.466, // 자전축 기울기 (26.7도)
                ring: {
                    texture: TX + 'saturnringcolor.jpg',
                    alpha: TX + 'saturnringpattern.gif',
                    inner: 1.25, // radius 대비 배율
                    outer: 2.3
                }
            },
            {
                name: 'uranus',
                korean: '천왕성',
                desc: '자전축이 약 98도 기울어져 누운 채로 자전하는 얼음 거대 행성이다.',
                texture: TX + 'uranusmap.jpg',
                radius: 0.8,
                segments: 64,
                rotationSpeed: 0.0015,
                tilt: 1.706, // 자전축 기울기 (97.8도 - 누워서 돔)
                ring: {
                    texture: TX + 'uranusringcolour.jpg',
                    alpha: TX + 'uranusringtrans.gif',
                    inner: 1.4,
                    outer: 2.0
                }
            },
            {
                name: 'neptune',
                korean: '해왕성',
                desc: '태양계 가장 바깥쪽의 행성으로, 시속 2,000km가 넘는 태양계에서 가장 빠른 바람이 분다.',
                texture: TX + 'neptunemap.jpg',
                radius: 0.78,
                segments: 64,
                rotationSpeed: 0.0016,
                tilt: 0.49 // 자전축 기울기 (28.3도)
            }
        ];

        const START = BODIES.findIndex(b => b.name === 'earth'); // 시작 화면은 지구

        const SPACING = 4;        // 천체 간 세로 간격
        let scene, camera, renderer, pointLight;
        const meshes = [];

        // ===== 태양 셰이더 (심플렉스 노이즈 기반 화염 표면 + 코로나) =====
        const NOISE_GLSL = `
            vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
            vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
            vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
            vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
            float snoise(vec3 v){
                const vec2 C = vec2(1.0/6.0, 1.0/3.0);
                const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i = floor(v + dot(v, C.yyy));
                vec3 x0 = v - i + dot(i, C.xxx);
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min(g.xyz, l.zxy);
                vec3 i2 = max(g.xyz, l.zxy);
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute(permute(permute(
                        i.z + vec4(0.0, i1.z, i2.z, 1.0))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0));
                float n_ = 0.142857142857;
                vec3 ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_);
                vec4 x = x_ * ns.x + ns.yyyy;
                vec4 y = y_ * ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4(x.xy, y.xy);
                vec4 b1 = vec4(x.zw, y.zw);
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
                vec3 p0 = vec3(a0.xy, h.x);
                vec3 p1 = vec3(a0.zw, h.y);
                vec3 p2 = vec3(a1.xy, h.z);
                vec3 p3 = vec3(a1.zw, h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
            }
            float fbm(vec3 p){
                float f = 0.0;
                float a = 0.5;
                for (int i = 0; i < 5; i++) {
                    f += a * snoise(p);
                    p *= 2.02;
                    a *= 0.5;
                }
                return f;
            }
        `;

        function makeSunSurfaceMaterial(initialOpacity) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uOpacity: { value: initialOpacity }
                },
                vertexShader: `
                    varying vec3 vPos;
                    void main() {
                        vPos = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: NOISE_GLSL + `
                    varying vec3 vPos;
                    uniform float uTime;
                    uniform float uOpacity;
                    void main() {
                        vec3 p = normalize(vPos);
                        // 도메인 워핑: 노이즈로 좌표 자체를 비틀어 규칙성 제거
                        vec3 warp = vec3(
                            fbm(p * 2.0 + vec3(uTime*0.07, 0.0, 0.0)),
                            fbm(p * 2.0 + vec3(0.0, uTime*0.05, 3.7)),
                            fbm(p * 2.0 + vec3(9.2, 0.0, uTime*0.06))
                        );
                        vec3 q = p * 3.0 + warp * 1.6;
                        float n1 = fbm(q + vec3(uTime*0.09, uTime*0.04, -uTime*0.06));
                        float n2 = fbm(q * 2.3 - vec3(uTime*0.13, -uTime*0.07, uTime*0.05));
                        float t = (n1*0.62 + n2*0.38) * 0.5 + 0.5;
                        // 화염 색 램프: 짙은 적색 -> 붉은색 -> 주황 (노란 백색은 아주 드물게)
                        vec3 c1 = vec3(0.22, 0.01, 0.0);
                        vec3 c2 = vec3(0.72, 0.09, 0.0);
                        vec3 c3 = vec3(1.00, 0.42, 0.03);
                        vec3 c4 = vec3(1.00, 0.88, 0.45);
                        vec3 col = mix(c1, c2, smoothstep(0.05, 0.50, t));
                        col = mix(col, c3, smoothstep(0.50, 0.82, t));
                        col = mix(col, c4, smoothstep(0.88, 1.00, t));
                        gl_FragColor = vec4(col, uOpacity);
                    }
                `,
                transparent: true
            });
        }

        function makeCoronaMaterial(initialOpacity, bodyRadius) {
            return new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uOpacity: { value: initialOpacity },
                    uBodyRadius: { value: bodyRadius }
                },
                vertexShader: `
                    varying vec3 vWorld;
                    varying vec3 vCenterW;
                    varying float vScale;
                    varying vec3 vPos;
                    void main() {
                        vPos = position;
                        vWorld = (modelMatrix * vec4(position, 1.0)).xyz;
                        vCenterW = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
                        vScale = length(vec3(modelMatrix[0][0], modelMatrix[1][0], modelMatrix[2][0]));
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: NOISE_GLSL + `
                    varying vec3 vWorld;
                    varying vec3 vCenterW;
                    varying float vScale;
                    varying vec3 vPos;
                    uniform float uTime;
                    uniform float uOpacity;
                    uniform float uBodyRadius;
                    void main() {
                        // 태양 중심으로부터의 화면상 거리 (rho = 1.0 이 태양 표면)
                        vec3 dirF = normalize(vWorld - cameraPosition);
                        vec3 dirC = normalize(vCenterW - cameraPosition);
                        float sinT = length(cross(dirF, dirC));
                        float sinA = (uBodyRadius * vScale) / max(distance(cameraPosition, vCenterW), 0.0001);
                        float rho = sinT / max(sinA, 0.0001);

                        // 노이즈로 불꽃 혀처럼 불규칙하게
                        vec3 p = normalize(vPos);
                        float flame = fbm(p * 4.0 + vec3(uTime*0.22, uTime*0.15, 0.0)) * 0.5 + 0.5;
                        flame = pow(flame, 1.5);

                        // 표면에서부터 바깥으로 지수 감쇠 -> 경계 없이 서서히 소멸
                        // 불꽃이 강한 곳은 조금 더 멀리 뻗는다
                        float edge = max(rho - 1.0, 0.0);
                        float k = 9.0 - 4.0 * flame;
                        float fall = exp(-k * edge);

                        vec3 col = mix(vec3(0.9, 0.15, 0.0), vec3(1.0, 0.55, 0.05), flame);
                        float alpha = fall * (0.45 + 1.1 * flame) * uOpacity;
                        gl_FragColor = vec4(col * (0.6 + flame), alpha);
                    }
                `,
                side: THREE.BackSide,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false
            });
        }

        let currentPos = START;   // 현재 스크롤 위치 (실수)
        let targetIndex = START;  // 목표 천체 인덱스
        let wheelLock = false;    // 전환 중 연속 휠 방지

        function initSpace() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0); // 투명 배경 → 뉴런 배경이 보임
            renderer.domElement.id = 'moonCanvas';
            document.body.appendChild(renderer.domElement);

            const textureLoader = new THREE.TextureLoader();

            BODIES.forEach((body, i) => {
                const group = new THREE.Group(); // 천체 + 고리를 함께 이동/기울임
                const materials = [];

                const geometry = new THREE.SphereGeometry(body.radius, body.segments, body.segments);
                let material;
                if (body.fire) {
                    material = makeSunSurfaceMaterial(i === START ? 1 : 0); // 태양: 화염 셰이더 표면
                } else {
                    const texture = textureLoader.load(body.texture);
                    const matParams = { map: texture, transparent: true, opacity: i === START ? 1 : 0 };
                    material = body.basic
                        ? new THREE.MeshBasicMaterial(matParams)
                        : new THREE.MeshPhongMaterial(matParams);
                    if (body.tint) material.color.set(body.tint);
                }
                const sphere = new THREE.Mesh(geometry, material);
                group.add(sphere);
                materials.push(material);

                // 화염 코로나 (가장자리 불꽃)
                if (body.fire) {
                    // 쉘은 넉넉하게 잡고, 알파 지수 감쇠로 그 안에서 자연 소멸시킨다
                    const coronaGeo = new THREE.SphereGeometry(body.radius * 1.6, 64, 64);
                    const coronaMat = makeCoronaMaterial(i === START ? 1 : 0, body.radius);
                    const corona = new THREE.Mesh(coronaGeo, coronaMat);
                    group.add(corona);
                    materials.push(coronaMat);
                }

                // 이글거리는 광채 (태양)
                let glowSprite = null;
                if (body.glow) {
                    const gc = document.createElement('canvas');
                    gc.width = gc.height = 256;
                    const g = gc.getContext('2d');
                    const grad = g.createRadialGradient(128, 128, 30, 128, 128, 128);
                    grad.addColorStop(0, 'rgba(255, 140, 50, 0.9)');
                    grad.addColorStop(0.35, 'rgba(255, 70, 20, 0.45)');
                    grad.addColorStop(0.7, 'rgba(255, 30, 0, 0.15)');
                    grad.addColorStop(1, 'rgba(255, 20, 0, 0)');
                    g.fillStyle = grad;
                    g.fillRect(0, 0, 256, 256);
                    const glowMat = new THREE.SpriteMaterial({
                        map: new THREE.CanvasTexture(gc),
                        blending: THREE.AdditiveBlending,
                        transparent: true,
                        depthWrite: false,
                        opacity: i === START ? 1 : 0
                    });
                    glowSprite = new THREE.Sprite(glowMat);
                    glowSprite.scale.setScalar(body.radius * 3.4);
                    group.add(glowSprite);
                }

                // 고리 (토성 등)
                let ringMat = null;
                if (body.ring) {
                    const inner = body.radius * body.ring.inner;
                    const outer = body.radius * body.ring.outer;
                    const ringGeo = new THREE.RingGeometry(inner, outer, 128);
                    // 고리 텍스처가 반지름 방향으로 감기도록 UV 재배치
                    const pos = ringGeo.attributes.position;
                    const v3 = new THREE.Vector3();
                    for (let k = 0; k < pos.count; k++) {
                        v3.fromBufferAttribute(pos, k);
                        ringGeo.attributes.uv.setXY(k, v3.length() < (inner + outer) / 2 ? 0 : 1, 1);
                    }
                    ringMat = new THREE.MeshBasicMaterial({
                        map: textureLoader.load(body.ring.texture),
                        alphaMap: body.ring.alpha ? textureLoader.load(body.ring.alpha) : null,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: i === START ? 1 : 0
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = -Math.PI / 2 + 0.15; // 살짝 비스듬히 보이게
                    group.add(ring);
                    materials.push(ringMat);
                }

                if (body.tilt) group.rotation.z = body.tilt; // 자전축 기울기

                group.position.y = -i * SPACING; // 다음 천체는 아래에 대기
                scene.add(group);
                meshes.push({ group, sphere, materials, ringMat, glow: glowSprite, glowBase: body.radius * 3.4 });
            });

            pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(10, 0, 10);
            scene.add(pointLight);

            camera.position.z = 3;
        }

        // ===== 좌측 정보 패널 & 컨트롤 =====
        const infoPanel = document.getElementById('infoPanel');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const zoomSlider = document.getElementById('zoomSlider');
        const zoomValue = document.getElementById('zoomValue');
        const lightSlider = document.getElementById('lightSlider');
        const lightValue = document.getElementById('lightValue');
        const ringCtrl = document.getElementById('ringCtrl');
        const ringSlider = document.getElementById('ringSlider');
        const ringValue = document.getElementById('ringValue');
        const lightCtrl = document.getElementById('lightCtrl');
        const coronaCtrl = document.getElementById('coronaCtrl');
        const coronaSlider = document.getElementById('coronaSlider');
        const coronaValue = document.getElementById('coronaValue');

        const speedFactors = BODIES.map(() => 50);   // 천체별 자전 속도 % (50% = 기본)
        const zoomFactors = BODIES.map(() => 65);    // 천체별 줌 % (기본을 약간 가깝게)
        const ringOpacities = BODIES.map(() => 100); // 고리 투명도 %
        let lightAngle = 45;                         // 광원 각도 (전역)
        let coronaIntensity = 50;                    // 태양 코로나 강도 % (50% = 기본)

        function wrapIndex(idx) {
            const N = BODIES.length;
            return ((idx % N) + N) % N;
        }

        function updatePanel(index) {
            const idx = wrapIndex(index);
            const body = BODIES[idx];
            document.getElementById('bodyName').textContent = body.name.toUpperCase();
            document.getElementById('bodyDesc').textContent = body.korean + ', ' + body.desc;
            speedSlider.value = speedFactors[idx];
            speedValue.textContent = speedSlider.value + '%';
            zoomSlider.value = zoomFactors[idx];
            zoomValue.textContent = zoomSlider.value + '%';
            lightSlider.value = lightAngle;
            lightValue.textContent = lightAngle + '°';
            // 태양: 라이트 앵글 대신 코로나 강도 표시 (자체 발광이라 광원 무의미)
            lightCtrl.style.display = body.fire ? 'none' : '';
            coronaCtrl.style.display = body.fire ? '' : 'none';
            coronaSlider.value = coronaIntensity;
            coronaValue.textContent = coronaIntensity + '%';
            // 고리가 있는 천체(토성, 천왕성)에서만 고리 컨트롤 표시
            ringCtrl.style.display = body.ring ? '' : 'none';
            ringSlider.value = ringOpacities[idx];
            ringValue.textContent = ringSlider.value + '%';
            // 등장 애니메이션 재시작
            infoPanel.classList.remove('show');
            void infoPanel.offsetWidth;
            infoPanel.classList.add('show');
        }

        speedSlider.addEventListener('input', () => {
            speedFactors[wrapIndex(targetIndex)] = Number(speedSlider.value);
            speedValue.textContent = speedSlider.value + '%';
        });

        zoomSlider.addEventListener('input', () => {
            zoomFactors[wrapIndex(targetIndex)] = Number(zoomSlider.value);
            zoomValue.textContent = zoomSlider.value + '%';
        });

        lightSlider.addEventListener('input', () => {
            lightAngle = Number(lightSlider.value);
            lightValue.textContent = lightAngle + '°';
            updateLight();
        });

        coronaSlider.addEventListener('input', () => {
            coronaIntensity = Number(coronaSlider.value);
            coronaValue.textContent = coronaIntensity + '%';
        });

        ringSlider.addEventListener('input', () => {
            ringOpacities[wrapIndex(targetIndex)] = Number(ringSlider.value);
            ringValue.textContent = ringSlider.value + '%';
        });

        function updateLight() {
            if (!pointLight) return;
            const r = 14.14; // 기존 (10, 0, 10) 위치와 같은 반지름
            const a = lightAngle * Math.PI / 180;
            pointLight.position.set(r * Math.cos(a), 0, r * Math.sin(a));
        }

        // 무한 순환: targetIndex는 제한 없이 증감, 표시할 때 모듈러로 감싼다
        function goTo(index) {
            targetIndex = index;
            updatePanel(index);
            // 사용자가 조작법을 알았으니 안내 화살표 제거
            document.querySelectorAll('.scrollHint').forEach(el => el.remove());
        }

        window.addEventListener('wheel', (e) => {
            if (wheelLock) return;
            goTo(targetIndex + (e.deltaY > 0 ? 1 : -1));
            wheelLock = true;
            setTimeout(() => { wheelLock = false; }, 900);
        }, { passive: true });

        // 마우스 드래그로 천체 직접 돌리기 (누르고 있는 동안 자전 정지)
        let dragging = false;
        let lastX = 0, lastY = 0;

        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('#infoPanel')) return; // 패널 조작은 제외
            dragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            renderer.domElement.classList.add('dragging');
        });

        window.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            lastX = e.clientX;
            lastY = e.clientY;
            const item = meshes[wrapIndex(targetIndex)];
            item.sphere.rotation.y += dx * 0.005; // 좌우 드래그 = 마우스 방향으로 회전
            // 상하 기울임은 그룹에 적용 -> 고리(토성, 천왕성)도 함께 기울어짐
            item.group.rotation.x = Math.max(-0.6, Math.min(0.6, item.group.rotation.x + dy * 0.003));
        });

        window.addEventListener('mouseup', () => {
            dragging = false;
            renderer.domElement.classList.remove('dragging');
        });

        // 모바일 스와이프 지원
        let touchStartY = null;
        window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
        window.addEventListener('touchend', (e) => {
            if (touchStartY === null) return;
            const dy = touchStartY - e.changedTouches[0].clientY;
            if (Math.abs(dy) > 50) goTo(targetIndex + (dy > 0 ? 1 : -1));
            touchStartY = null;
        }, { passive: true });

        function animateSpace() {
            requestAnimationFrame(animateSpace);

            // 목표 위치로 부드럽게 이동 (easing)
            currentPos += (targetIndex - currentPos) * 0.05;

            const N = BODIES.length;
            const time = performance.now() / 1000;
            meshes.forEach((item, i) => {
                // 자전 (50% = 기본 속도) - 현재 천체를 드래그 중이면 자전 정지 (마우스로 직접 회전)
                if (!(dragging && i === wrapIndex(targetIndex))) {
                    item.sphere.rotation.y += BODIES[i].rotationSpeed * (speedFactors[i] / 50);
                }

                // 순환 오프셋: 가장 가까운 방향으로 감싸서 계산 (-N/2 ~ N/2)
                let offset = (((i - currentPos) % N) + N) % N;
                if (offset > N / 2) offset -= N;

                item.group.position.y = -offset * SPACING;    // 휠 다운 → 현재 천체 위로, 다음 천체 아래에서 등장
                const t = Math.min(Math.abs(offset), 1);
                const scale = 1 - t * 0.5;                    // 멀어질수록 작아짐
                item.group.scale.setScalar(scale);
                item.materials.forEach(m => { // 멀어질수록 fade out
                    if (m.uniforms) { // 셰이더 재질 (태양)
                        // 코로나 재질(uBodyRadius 보유)은 강도 슬라이더 반영 (50% = 기본)
                        const boost = m.uniforms.uBodyRadius ? coronaIntensity / 50 : 1;
                        m.uniforms.uOpacity.value = (1 - t) * boost;
                        m.uniforms.uTime.value = time;
                    } else {
                        m.opacity = 1 - t;
                    }
                });

                // 고리 투명도 (fade와 곱해서 적용)
                if (item.ringMat) {
                    item.ringMat.opacity = (1 - t) * (ringOpacities[i] / 100);
                }

                // 태양 광채: 크기와 밝기를 불규칙하게 흔들어 이글거리는 느낌
                if (item.glow) {
                    const flicker = 0.55 + 0.12 * Math.sin(time * 2.1) + 0.08 * Math.sin(time * 5.7);
                    item.glow.material.opacity = (1 - t) * flicker * (coronaIntensity / 50);
                    item.glow.scale.setScalar(item.glowBase * (1 + 0.05 * Math.sin(time * 3.3)));
                }
            });

            // 줌: 현재 천체의 줌 값으로 카메라 거리를 부드럽게 이동 (50% = 기본 z=3)
            const targetZ = 4.5 - (zoomFactors[wrapIndex(targetIndex)] / 100) * 3;
            camera.position.z += (targetZ - camera.position.z) * 0.05;

            renderer.render(scene, camera);
        }

        initSpace();
        animateSpace();
        updatePanel(START);

        // ===== 리사이즈 =====
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            maxNeurons = calculateMaxNeurons();

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== 시계 =====
        function updateClock() {
            const now = new Date();
            const year = String(now.getFullYear());
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0').slice(0, 2);

            document.getElementById('year').textContent = year;
            document.getElementById('month').textContent = month;
            document.getElementById('day').textContent = day;
            document.getElementById('hours').textContent = hours;
            document.getElementById('minutes').textContent = minutes;
            document.getElementById('seconds').textContent = seconds;
            document.getElementById('milliseconds').textContent = milliseconds;
        }

        setInterval(updateClock, 10);
        updateClock();
    </script>
</body>
</html>
